# The merge map of the category data-type union (carttrace.bench.union_types, D62): which observed keys state the same
# thing, under one curated id with a plain name. It lists no type by itself: a type is in a category's union only when
# a store of that category shows one of its keys, and every key no entry names keeps an id made from its own name
# (`schema.offer.price-valid-until`, `label.front-rise`), so nothing a store shows is dropped.
#
# Written on 2026-10-13 from the keys the W42 capture pass (548 stores) and 2,668 live agent-view bundles actually
# carried: every name below was seen on at least one store. Add a name here when a labeler merges an auto type into
# a curated one (labels.jsonl status merged), and add the old id under `former` so labels and renames follow it.
#
# A type:
#   id      <area>.<name>, lower snake case; never reused for another meaning
#   name    what a labeler reads
#   group   the section it is listed under (Product facts, Variant facts, Stock and availability, Price, Reviews and
#           Q&A, Delivery, Returns and policies, Media, Badges and claims, Bundles, subscriptions and gifts,
#           Identity and navigation, Store-level)
#   row     the exposure taxonomy row (docs/STORE-EXPOSURE.md section 3); a checklist check on this row maps to it
#   kinds   the brief's data kinds (carttrace.agents.brief); a check needing one of them maps to it
#   keys    observed keys, exact or fnmatch patterns; exact keys win over patterns, patterns go in file order
#   labels  free-label slugs: spec rows, "Label:" lines, section headings, "key: value" tags, app-state fields,
#           schema.org PropertyValue names and agent-view metafields
#   options variant option name slugs
schema: mc.bench.union_types.v1
version: union-types-2026-10-13
