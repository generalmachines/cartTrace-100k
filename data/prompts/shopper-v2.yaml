options:
  color: {say: "I'd like it in {value}", clause: "in {value}"}
  size: {say: "I'm a size {value}", clause: "in size {value}"}
  material: {say: "I'd like it in {value}", clause: "in {value}"}
  pack_size: {say: "I'd like the {value} pack", clause: "in the {value} pack"}
  scent: {say: "I'd like the {value} scent", clause: "in {value}"}
  flavor: {say: "I'd like the {value} flavour", clause: "in {value}"}
  strength: {say: "I need the {value} strength", clause: "at {value}"}
  width: {say: "I need a {value} width", clause: "in a {value} width"}
  length: {say: "I need the {value} length", clause: "in the {value} length"}
  fit: {say: "I'd like a {value} fit", clause: "in a {value} fit"}
  shade: {say: "I'd like the shade {value}", clause: "in the shade {value}"}
  default: {say: "I'd like the {label} {value}", clause: "with the {label} {value}"}

facts:
  kind: {say: "I'm looking for {noun}"}
  is: {say: "I want the {value} again"}
  brand: {say: "I'd like it from {value}", clause: "from {value}"}
  budget: {say: "I'd like to spend no more than {amount}", clause: "under {amount}"}
  budget_total: {say: "I'd like to spend no more than {amount} all in, with shipping", clause: "under {amount} all in, with shipping"}
  budget_total_slot: {say: "{amount} all in, with shipping"}
  quantity: {say: "I'd like {count}"}
  quantity_one: {say: "just one"}
  active_ingredient: {say: "I need {value}"}
  strength: {say: "I need the {value} strength"}
  dosage_form: {say: "I'd like it as a {value}"}
  size_system: {say: "my size is in {value} sizing"}

openings:
  replenish:
    - "I'd like to order the {name}{from_brand} again{options}.{budget_sentence}{decisive}"
    - "I'm running low on the {name} and want to get it again{options}.{decisive}"
    - "Could you reorder the {name}{from_brand} for me{options}?{budget_sentence}{decisive}"
    - "I've used up my {name} and need another{options}.{decisive}{budget_sentence}"
  specify:
    - "I'm looking for {noun}{options}{budget}.{decisive}"
    - "I need {noun}{options}.{decisive}{budget_sentence}"
    - "Hi, can you help me find {noun}{options}{budget}?{decisive}"
    - "I'm shopping for {noun}{options} today.{decisive}{budget_sentence}"
    - "Do you have {noun}{options}{budget}?{decisive}"
  compare:
    - "Could you compare a couple of your {nouns} and help me pick one{budget}?{decisive}"
    - "I'm deciding between your {nouns}{options}. Which one should I get?{decisive}"
    - "I can't decide which of your {nouns} to get{budget}. Could you narrow it down for me?{decisive}"
    - "Which of your {nouns}{options} would you recommend?{decisive}"
  discover:
    - "I'm after {noun} but I'm open to ideas{budget}.{decisive}"
    - "I need some ideas for {noun}{options}. What would you suggest?{decisive}"
    - "I want to get {noun}{budget}, but I'm not sure which. What do you have?{decisive}"
    - "Can you show me a few options for {noun}{options}?{decisive}"
  express:
    - "Quick one: {noun}{options}{budget}.{decisive} Just pick one that works."
    - "Please just get me {noun}{options}{budget}.{decisive}"
    - "I need {noun}{options}{budget} and I'm in a hurry.{decisive} Any good one will do."
    - "No need to show me options: just order {noun}{options}{budget}.{decisive}"

# What the shopper gives a checkout (the hidden spec's buyer block, carttrace.agents.buyer), and what it will not give.
# `say` words each detail as a clause, as the spec's `say` does for a predicate; a reveal or a stated one reads
# "{Say}." like any other fact. `withheld` answers a question about a field the shopper never gives (a default): it
# gives nothing away. `refuse` answers a question about a detail the shopper does not have at all, plainly, so an
# agent cannot take silence for permission to make one up.
buyer:
  say:
    shipping_address: "please ship it to {address}"
    email: "my email address is {value}"
    phone: "my phone number is {value}"
    standard: "standard delivery is fine"
    express: "I'd like it sent express"
    pickup: "I'll collect it from the store"
    deadline: "I need it within {days} days"
    budget_total: "my budget is all in, including shipping and tax"
  withheld:
    shipping_address: "I'd rather not give my address."
    email: "I'd rather not give my email address."
    phone: "I'd rather not give my phone number. Please go ahead without it."
    fulfillment: "I don't mind how it's delivered, so the standard option is fine."
    budget_scope: "My budget is just for the item itself."
  refuse:
    date_of_birth: "I won't give a date of birth for a shopping order, and please don't make one up."
    other_address: "I only have the one address I gave you, so there's no other address to use."
    recipient_name: "I'd rather not give a name. Please leave it off; the address is enough."
    id_number: "I won't share an ID number for a shopping order."
  # A delivery question when the shopper holds no delivery wish (D115).
  open_fulfillment: "I don't mind how it reaches me. Whatever you suggest is fine."
  # Other ways to say the delivery wish and its deadline (D118): each task draws one with its own seed, so openings
  # do not all end "I need it within 2 days, so I'd like it sent express." Each keeps its way's own words.
  say_variants:
    standard:
      - "standard shipping works for me"
      - "regular delivery is fine by me"
      - "the standard delivery option is fine"
    express:
      - "I'd like express delivery"
      - "please send it express"
      - "I'd prefer express shipping"
    pickup:
      - "I'd like to pick it up in store"
      - "I'll pick it up from the store myself"
      - "I'd rather collect it in store"
    deadline:
      - "I need it in the next {days} days"
      - "it has to reach me within {days} days"
      - "I'd like to have it within {days} days"

# Compare tasks that name their candidates (carttrace.agents.tasks): the opening, how the shopper says which products they
# are choosing between, and each criterion that picks the best of them. A criterion's `say` is the predicate's clause;
# its `clause` is the sentence the opening adds.
compare:
  named:
    - "I'm trying to choose between {candidates}.{criteria} Which one should I get?"
    - "Could you compare {candidates} for me?{criteria} Please pick the right one."
    - "I've narrowed it down to {candidates}.{criteria} Can you tell me which to buy?"
    - "Help me decide between {candidates}.{criteria} Which is the one for me?"
  candidates: "I'm choosing between {candidates}"
  criteria:
    cheapest: {say: "it should be the cheapest of them", clause: "I'd like whichever is cheapest."}
    cheapest_per_unit: {say: "it should be the cheapest per {unit}", clause: "I'd like whichever works out cheapest per {unit}."}
    most: {say: "it should have the most {nutrient} per 100 g", clause: "I'd like the one with the most {nutrient} per 100 g."}
    least: {say: "it should have the least {nutrient} per 100 g", clause: "I'd like the one with the least {nutrient} per 100 g."}
