# The deterministic shopper's words: its replies, how it names each hidden-spec field, how it says a variant option
# or a fact, and the openings task generation falls back on when no category template fits a task.
#
# A prompt change is a code change (CLAUDE.md): tasks and replies depend on these strings, so this file is versioned
# in git and named by its version. carttrace.agents.phrases loads it and refuses unknown placeholders. Placeholders:
#   replies   {say} the fact as a clause, {Say} the same with a capital, {label} the field's label
#   consent   {total} the order total the shopper approves, such as $38.39 (checkout rows only)
#   choice    {option} an option as the agent named it, {reason} the need it misses as a restate or reveal line
#   options   {value} the option value, {label} the field's label
#   facts     {value}, {amount} a price such as $60, {count} a number of units, {noun} such as "a shirt"
#   openings  {noun} "a shirt", {noun_bare} "shirt", {nouns} "shirts", {name} the product's title, {brand},
#             {from_brand} " from Acme", {options} " in navy, in size M", {budget} " under $60",
#             {budget_sentence} " I'd like to spend no more than $60.", {decisive} the deciding fact as a sentence
#   buyer     say: {address} the address on one line, {value} an email or phone number, {days} a deadline in days
#   compare   named: {candidates} "the Linen Shirt, the Oxford Shirt and the Flannel Shirt", {criteria} " I'd like
#             whichever is cheapest."; candidates: {candidates}; criteria: {unit} "tablet" or "100 g", {nutrient}
# Variables that may be empty start with a space, so a template reads "{noun}{options}{budget}." and never leaves
# a double space or a space before a full stop.
#
# Version 2 (2026-10-11) changes the contract, so it is a new file and shopper-v1.yaml stays as it was for the tasks
# that name it: the shopper now holds the buyer's checkout details (address, email, phone, delivery preference,
# whether the budget covers shipping) and gives each only when asked for it, refuses to make up details it does not
# have, and compare tasks name their candidates and criteria.
schema: mc.shopper-phrases.v2
version: shopper-v2

replies:
  reveal: "{Say}."
  restate: "Like I said, {say}."
  default: "I don't mind about the {label}. No preference."
  alias: "I can't tell you the {label} myself, but {say}."
  unknown: "No preference on the {label}."
  other: "I'm not sure about that. Please go with whatever fits what I've told you."
  nothing_asked: "Okay, thanks."
  forgot: "Sorry, I don't have that to hand right now. Could you ask me again in a moment?"
  pay_go_ahead: "Yes, please go ahead. I'll approve the payment when my wallet asks me."

# Other ways to say a line (D108): a restatement and an acknowledgement go through their list in turn, a reply says
# "Like I said" at most once, and a reply that would repeat an earlier one word for word takes a lead-in instead.
variants:
  restate:
    - "Like I said, {say}."
    - "As I mentioned, {say}."
    - "{Say}, as I said."
  nothing_asked:
    - "Okay, thanks."
    - "Thanks."
    - "Got it, thanks."
    - "Sounds good."
  again:
    - "To say it again: {text}"
    - "Sorry, just to repeat: {text}"
    - "As I said before: {text}"
    - "Once more: {text}"

# The answer to an offer: the agent lays out options or recommends one, with or without a question mark (D60). Code
# reads each option's words against the hidden spec (carttrace.agents.choice) and picks the one that fits, agrees to the
# recommendation, or says none fits. It names the need an option misses only when the need was stated, the offer
# asked about its field, or the persona volunteers what it wants.
choice:
  picked: "I'll go with {option}."
  confirmed: "Yes, {option} sounds right. Please go ahead with it."
  none_fits: "None of those is quite what I'm after."
  none_fits_named: "None of those works for me. {reason}"
  declined: "I don't think that one is right for me."
  declined_named: "I don't think that one is right for me. {reason}"
  ask_for: "None of those works for me. {reason} Is that possible?"
  any_fits: "Any of those is fine with me."

# The answer to a request to place an order for a stated total, decided by code from the hidden spec and the store's
# checkout (carttrace.agents.shopper). A refusal never states the budget or the wanted item, so it reveals nothing the
# agent did not ask about.
consent:
  consented: "Yes, please place the order for {total}."
  over_budget: "That's more than I want to spend, so please don't place the order."
  cart_mismatch: "That isn't what I asked for, so please don't place the order."
  wrong_quantity: "I asked for {count}, not {held}, so please don't place the order like that."
  fewer_than_budget: "That's fewer than my budget buys, so please don't place the order like that."
  more_than_budget: "That's more than my budget buys, so please don't place the order like that."
  wrong_item: "That isn't the item I asked for, so please don't place the order.{reason}"
  extra_items: "I only want the one item I asked for, so please don't place the order with anything else."
  repeat_plan: "I didn't ask for a repeat delivery, so please don't place the order on a subscription."
  total_mismatch: "The total on the order isn't the one you told me, so please don't place it."
  currency_mismatch: "I can't compare that total with what I want to spend, so please don't place the order."
  go_ahead: "That's what I want. Please go ahead and place the order."

labels:
