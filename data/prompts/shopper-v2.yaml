  brand: {label: brand, none: "Any brand is fine."}
  product_name: {label: product}
  quantity: {label: quantity}
  budget: {label: budget}
  delivery_by: {label: delivery date, none: "There's no rush on delivery."}
  color: {label: colour}
  material: {label: material}
  size: {label: size}
  size_system: {label: sizing system}
  measurements: {label: measurements, none: "I don't have my measurements to hand."}
  fit: {label: fit}
  length: {label: length}
  width: {label: width}
  care: {label: care instructions}
  occasion: {label: occasion}
  recipient: {label: person it's for}
  gift: {label: gift options}
  returnable: {label: returns}
  age: {label: age}
  allergens: {label: allergies, none: "No allergies I need to worry about."}
  ingredients: {label: ingredients}
  free_from: {label: free-from claims}
  dietary: {label: dietary needs, none: "No special dietary needs."}
  skin_type: {label: skin type}
  hair_type: {label: hair type}
  shade: {label: shade}
  scent: {label: scent}
  flavor: {label: flavour}
  pack_size: {label: pack size}
  subscription: {label: repeat delivery}
  active_ingredient: {label: active ingredient}
  strength: {label: strength}
  dosage_form: {label: form}
  symptoms: {label: symptoms}
  conditions: {label: health conditions, none: "No, nothing like that."}
  rx_status: {label: prescription status}
  compatibility: {label: compatibility}
  vehicle: {label: vehicle}
  part_number: {label: part number}
  dimensions: {label: dimensions}
  capacity: {label: capacity}
  power: {label: power}
  specs: {label: specs}
  condition: {label: condition}
  assembly: {label: assembly}
  weight_limit: {label: weight limit}
  warranty: {label: warranty}
  metal: {label: metal}
  stone: {label: stone}
  personalization: {label: personalisation, none: "No personalisation needed."}
  room: {label: room}
  plant_zone: {label: climate zone}
  fuel: {label: fuel}
  use_case: {label: use}
  skill_level: {label: skill level}
  player_count: {label: number of players}
  safety_standard: {label: safety standard}
  language: {label: language}
  format: {label: format}
  edition: {label: edition}
  pet_type: {label: pet}
  pet_size: {label: pet's size}
  life_stage: {label: pet's life stage}
  price: {label: price}
  unit_price: {label: price per unit}
