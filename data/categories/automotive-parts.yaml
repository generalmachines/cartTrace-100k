# Category 20 of the store queue: Automotive / parts.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Automotive / parts
slug: automotive-parts
index: 20
summary: Vehicle parts, tyres, accessories and car care products.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: vp-1
      path: Vehicles & Parts > Vehicle Parts & Accessories
    - id: vp-1-4
      path: Vehicles & Parts > Vehicle Parts & Accessories > Motor Vehicle Parts
    - id: vp-1-5
      path: Vehicles & Parts > Vehicle Parts & Accessories > Vehicle Maintenance, Care & Decor
hidden_spec:
  - product_type
  - brand
  - product_name
  - vehicle
  - part_number
  - specs
  - quantity
  - condition
  - budget
  - delivery_by
  - assembly
intents:
  replenish:
    - id: automotive-parts.replenish.1
      text: I need the same {product_name} again for my {vehicle}.
      slots: [product_name, vehicle]
    - id: automotive-parts.replenish.2
      text: Please reorder part {part_number}, {quantity} of them.
      slots: [part_number, quantity]
  specify:
    - id: automotive-parts.specify.1
      text: I need {product_type} for a {vehicle}, {specs}, under {budget}.
      slots: [product_type, vehicle, specs, budget]
    - id: automotive-parts.specify.2
      text: Looking for a {condition} replacement for part {part_number}, delivered by {delivery_by}.
      slots: [condition, part_number, delivery_by]
  compare:
    - id: automotive-parts.compare.1
      text: 'Compare your {product_type}s for my {vehicle}: which lasts longer, and which is quieter?'
      slots: [product_type, vehicle]
    - id: automotive-parts.compare.2
      text: Is the aftermarket {product_type} as good as the original part {part_number}?
      slots: [product_type, part_number]
  discover:
    - id: automotive-parts.discover.1
      text: My {vehicle} needs a service. Which parts should I order to do it myself?
      slots: [vehicle]
    - id: automotive-parts.discover.2
      text: I'm looking for useful accessories for my {vehicle} under {budget}.
      slots: [vehicle, budget]
  express:
    - id: automotive-parts.express.1
      text: Just send me {product_type} that fit my {vehicle} by {delivery_by}.
      slots: [product_type, vehicle, delivery_by]
    - id: automotive-parts.express.2
      text: Pick a {product_type} for a {vehicle}, {assembly}.
      slots: [product_type, vehicle, assembly]
hypotheses:
  - id: automotive-parts.structured-fitment
    statement: Vehicle fitment (year, make, model, engine, trim) is structured data, not only a lookup widget.
    why: Fitment is the deciding fact for a part, and a widget a text agent cannot drive leaves it guessing from titles.
    where: [get_product.attributes, get_product.metafields]
    details: [compatibility]
    judge_decision: judge.fitment_matches_vehicle
    evidence_grade: hypothesis
  - id: automotive-parts.part-number-cross-reference
    statement: OEM and manufacturer part numbers and cross-references are text.
    why: Mechanics and owners shop by part number, which is the most reliable match.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.part_number_matches_spec
    evidence_grade: hypothesis
  - id: automotive-parts.tyre-and-wheel-specs
    statement: Tyre and wheel specs are attributes (size, load index, speed rating, season).
    why: Tyres are matched on several codes at once, and all of them must be right.
    where: [get_product.attributes, get_product.options]
    judge_decision: judge.spec_matches_spec
    evidence_grade: hypothesis
  - id: automotive-parts.core-charges-and-hazmat
    statement: Core charges and hazardous shipping limits (batteries, fluids) are stated before checkout.
    why: Both change the price or the delivery and surprise shoppers at checkout.
    where: [get_product.description, policies]
    judge_decision: judge.delivery_constraint_disclosed
    evidence_grade: hypothesis
  - id: automotive-parts.installation
    statement: Installation needs (tools, professional fitting, programming) are stated.
    why: Some parts need coding or a garage, which shoppers need to know before buying.
    where: [get_product.description, get_product.metafields]
    judge_decision: judge.assembly_matches_spec
    evidence_grade: hypothesis
  - id: automotive-parts.electrical-returns
    statement: Returns for electrical and installed parts are answerable through the policy tool.
    why: Electrical parts are often non-returnable once fitted.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
