# Category 24 of the store queue: Gifts / collectibles.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Gifts / collectibles
slug: gifts-collectibles
index: 24
summary: Gifts, personalised items, flowers and collectibles.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: ae-3-1
      path: Arts & Entertainment > Party & Celebration > Gift Giving
    - id: ae-2-2
      path: Arts & Entertainment > Hobbies & Creative Arts > Collectibles
hidden_spec:
  - product_type
  - brand
  - product_name
  - recipient
  - occasion
  - personalization
  - edition
  - condition
  - gift
  - budget
  - quantity
  - delivery_by
intents:
  replenish:
    - id: gifts-collectibles.replenish.1
      text: Please send the same {product_name} as last year to my mother.
      slots: [product_name]
    - id: gifts-collectibles.replenish.2
      text: I'd like {quantity} more of the {product_type} I ordered for the team.
      slots: [quantity, product_type]
  specify:
    - id: gifts-collectibles.specify.1
      text: I need a {product_type} personalised with {personalization}, delivered by {delivery_by}, under {budget}.
      slots: [product_type, personalization, delivery_by, budget]
    - id: gifts-collectibles.specify.2
      text: Looking for the {edition} of {product_name} in {condition} condition.
      slots: [edition, product_name, condition]
  compare:
    - id: gifts-collectibles.compare.1
      text: 'Compare two gifts for {occasion} under {budget}: which arrives sooner?'
      slots: [occasion, budget]
    - id: gifts-collectibles.compare.2
      text: Which of your {product_type}s is a limited edition, and how many were made?
      slots: [product_type]
  discover:
    - id: gifts-collectibles.discover.1
      text: I need a {occasion} gift for {recipient}. Ideas under {budget}?
      slots: [occasion, recipient, budget]
    - id: gifts-collectibles.discover.2
      text: I'm looking for something memorable for {recipient}, who collects things.
      slots: [recipient]
  express:
    - id: gifts-collectibles.express.1
      text: Just send a {occasion} gift to {recipient} by {delivery_by}, gift wrapped, with no prices on the receipt.
      slots: [occasion, recipient, delivery_by]
    - id: gifts-collectibles.express.2
      text: Pick a {product_type} under {budget} and add a message.
      slots: [product_type, budget]
hypotheses:
  - id: gifts-collectibles.personalisation-and-proofs
    statement: Personalisation options state their character limits, proof steps and production time.
    why: Personalised gifts fail on spelling and on timing, and both need to be visible to the agent.
    where: [get_product.options, get_product.description]
    judge_decision: judge.personalization_handled
    evidence_grade: hypothesis
  - id: gifts-collectibles.gift-options
    statement: Gift wrap, a message and hidden prices are options with their costs.
    why: These are the defining extras of a gift purchase.
    where: [get_product.options, policies]
    judge_decision: judge.gift_options_handled
    evidence_grade: hypothesis
  - id: gifts-collectibles.guaranteed-delivery
    statement: Delivery by a date, or a guaranteed delivery service, is shown before checkout.
    why: Gifts are bought for a date, and late is a failure even when the cart was right.
    where: [policies, get_product.description]
    judge_decision: judge.delivery_by_respected
    evidence_grade: hypothesis
  - id: gifts-collectibles.authenticity-and-edition
    statement: Edition size, numbering and certificates of authenticity are text.
    why: Collectibles are valued on scarcity and provenance, which only text can state.
    where: [get_product.description, get_product.attributes, get_product.metafields]
    judge_decision: judge.claims_supported
    evidence_grade: hypothesis
  - id: gifts-collectibles.collectible-condition
    statement: The condition of the item and of its packaging is graded.
    why: Collectors pay for packaging condition as much as for the item.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.condition_matches_spec
    evidence_grade: hypothesis
  - id: gifts-collectibles.personalised-returns
    statement: Returns for personalised items are answerable through the policy tool.
    why: Personalised items are usually non-returnable, which shoppers want to know.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
