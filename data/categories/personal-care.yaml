# Category 7 of the store queue: Personal care.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Personal care
slug: personal-care
index: 7
summary: Personal care such as shaving, deodorant, oral care, and bath and body.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: hb-3
      path: Health & Beauty > Personal Care
    - id: hb-3-14
      path: Health & Beauty > Personal Care > Shaving & Grooming
    - id: hb-3-5
      path: Health & Beauty > Personal Care > Deodorants & Anti-Perspirant
    - id: hb-3-12
      path: Health & Beauty > Personal Care > Oral Care
hidden_spec:
  - product_type
  - brand
  - product_name
  - compatibility
  - scent
  - ingredients
  - free_from
  - skin_type
  - age
  - pack_size
  - subscription
  - budget
  - quantity
intents:
  replenish:
    - id: personal-care.replenish.1
      text: I need refills for my {product_name}, {quantity} packs please.
      slots: [product_name, quantity]
    - id: personal-care.replenish.2
      text: 'I''m out of my usual {brand} {product_type}: the {scent} one, {pack_size}.'
      slots: [brand, product_type, scent, pack_size]
  specify:
    - id: personal-care.specify.1
      text: I need {product_type} that fits {compatibility}, at most {budget}.
      slots: [product_type, compatibility, budget]
    - id: personal-care.specify.2
      text: Looking for a {free_from} {product_type} in {scent} for {skin_type} skin.
      slots: [free_from, product_type, scent, skin_type]
  compare:
    - id: personal-care.compare.1
      text: 'Compare your {product_type}s: which is gentler on {skin_type} skin, and which lasts longer?'
      slots: [product_type, skin_type]
    - id: personal-care.compare.2
      text: Is the {pack_size} pack of {product_name} cheaper per unit than the smaller one?
      slots: [pack_size, product_name]
  discover:
    - id: personal-care.discover.1
      text: I want to switch to a {free_from} {product_type}. What do you have?
      slots: [free_from, product_type]
    - id: personal-care.discover.2
      text: I'm looking for a starter kit for someone aged {age}. What would you suggest?
      slots: [age]
  express:
    - id: personal-care.express.1
      text: Send me {quantity} of the {product_type} that fit {compatibility}, the cheapest option.
      slots: [quantity, product_type, compatibility]
    - id: personal-care.express.2
      text: Just pick a {scent} {product_type} with {ingredients}, under {budget}.
      slots: [scent, product_type, ingredients, budget]
hypotheses:
  - id: personal-care.refill-compatibility
    statement: Refills and replacement heads list, by model, the handles or devices they fit.
    why: Refills that do not fit are the classic replenish failure, and a model list makes fit checkable.
    where: [get_product.description, get_product.attributes, get_product.metafields]
    details: [compatibility]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: personal-care.ingredients-free-from
    statement: Ingredients and free-from claims (aluminium-free, fluoride, fragrance-free) are text.
    why: These are hard requirements for many shoppers, and only text can confirm them.
    where: [get_product.description, get_product.attributes]
    details: [ingredients, allergens]
    judge_decision: judge.ingredient_constraint_met
    evidence_grade: hypothesis
  - id: personal-care.skin-suitability
    statement: The skin types or sensitivities a product is for are stated.
    why: Sensitive-skin shoppers filter on this first, so it should be explicit.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.skin_type_matches_spec
    evidence_grade: hypothesis
  - id: personal-care.pack-count
    statement: Pack count and size are attributes per variant, so a price per unit can be computed.
    why: Multipacks are where value comparisons happen, and counts buried in titles are easy to misread.
    where: [get_product.options, get_product.attributes]
    details: [pack_size]
    judge_decision: judge.pack_size_matches_spec
    evidence_grade: hypothesis
  - id: personal-care.subscription-plans
    statement: Repeat delivery is a selling plan with its interval and discount.
    why: Replenishment is the main use of this category, and the agent needs the plan to set it up.
    where: [get_product.options, policies]
    judge_decision: judge.subscription_handled
    evidence_grade: hypothesis
  - id: personal-care.age-warnings
    statement: Age limits and warnings (not for children under 12, use under supervision) are text.
    why: A shopper buying for a child needs the age limit, and marketing copy rarely carries it.
    where: [get_product.description, get_product.metafields]
    details: [warnings]
    judge_decision: judge.age_suitability_correct
    evidence_grade: hypothesis
  - id: personal-care.hygiene-returns
    statement: The returns policy for opened hygiene items is answerable through the policy tool.
    why: Hygiene items are often non-returnable once opened, which shoppers want to know before buying.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
