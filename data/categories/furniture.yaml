# Category 10 of the store queue: Furniture.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Furniture
slug: furniture
index: 10
summary: Furniture for the home and the home office.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: fr
      path: Furniture
    - id: fr-12
      path: Furniture > Office Furniture
hidden_spec:
  - product_type
  - brand
  - product_name
  - dimensions
  - material
  - color
  - weight_limit
  - assembly
  - room
  - budget
  - delivery_by
  - quantity
  - returnable
intents:
  replenish:
    - id: furniture.replenish.1
      text: I'd like two more of the {product_name} chairs to match mine, in {color}.
      slots: [product_name, color]
    - id: furniture.replenish.2
      text: Can I order the same {product_type} again, {quantity} of them?
      slots: [product_type, quantity]
  specify:
    - id: furniture.specify.1
      text: I need a {material} {product_type} no bigger than {dimensions}, in {color}, under {budget}.
      slots: [material, product_type, dimensions, color, budget]
    - id: furniture.specify.2
      text: Looking for a {product_type} that holds {weight_limit}, with {assembly}, delivered by {delivery_by}.
      slots: [product_type, weight_limit, assembly, delivery_by]
  compare:
    - id: furniture.compare.1
      text: 'Compare your two best {product_type}s under {budget}: build quality, size and delivery time.'
      slots: [product_type, budget]
    - id: furniture.compare.2
      text: Which {product_type} fits through a doorway of {dimensions} and is easier to assemble?
      slots: [product_type, dimensions]
  discover:
    - id: furniture.discover.1
      text: I'm furnishing a small {room}. What would fit and look good under {budget}?
      slots: [room, budget]
    - id: furniture.discover.2
      text: I'm looking for a {product_type} for my {room} in {material}. What do you recommend?
      slots: [product_type, room, material]
  express:
    - id: furniture.express.1
      text: Need a {product_type} for my {room} delivered by {delivery_by}, {assembly}, under {budget}.
      slots: [product_type, room, delivery_by, assembly, budget]
    - id: furniture.express.2
      text: Just pick a {color} {product_type} smaller than {dimensions} that I can return.
      slots: [color, product_type, dimensions]
hypotheses:
  - id: furniture.dimensions-and-packaging
    statement: Assembled dimensions, packaged dimensions and the narrowest doorway the item passes are text.
    why: Furniture fails at the door, not in the room, and the packaged size decides whether delivery works.
    where: [get_product.attributes, get_product.description, get_product.metafields]
    details: [dimensions]
    judge_decision: judge.dimensions_within_spec
    evidence_grade: hypothesis
  - id: furniture.assembly-information
    statement: Whether assembly is needed, how long it takes, the tools needed and whether an assembly service is offered
      are stated.
    why: No assembly is a common requirement, and assembly services change the price and the delivery date.
    where: [get_product.description, get_product.options, policies]
    judge_decision: judge.assembly_matches_spec
    evidence_grade: hypothesis
  - id: furniture.materials-and-finish
    statement: Materials are specific (solid oak, oak veneer on MDF, performance fabric), with finish options.
    why: Solid wood and veneer look the same in photos and differ in price and lifespan.
    where: [get_product.attributes, get_product.description]
    details: [material]
    judge_decision: judge.material_matches_spec
    evidence_grade: hypothesis
  - id: furniture.weight-capacity
    statement: Weight capacity (seat, shelf, bed) is a number.
    why: Shoppers with a load in mind need a number to check, not a claim such as sturdy.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.spec_matches_spec
    evidence_grade: hypothesis
  - id: furniture.delivery-service-levels
    statement: Delivery service levels (kerbside, room of choice, white glove) and lead times are options with prices.
    why: Furniture lead times run to weeks, and a shopper with a date needs the agent to see it.
    where: [get_product.options, policies]
    judge_decision: judge.delivery_by_respected
    evidence_grade: hypothesis
  - id: furniture.fabric-and-finish-options
    statement: Fabric and finish choices are variant options with plain names and swatch descriptions.
    why: A swatch code alone does not let the agent match a requested colour or fabric.
    where: [get_product.options]
    judge_decision: judge.variant_matches_spec
    evidence_grade: hypothesis
  - id: furniture.large-item-returns
    statement: Returns for large items (restocking fees, collection cost, window) are answerable through the policy tool.
    why: Returning a sofa can cost a large share of its price, so shoppers ask first.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
