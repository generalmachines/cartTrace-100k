# Category 16 of the store queue: Baby / kids.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Baby / kids
slug: baby-kids
index: 16
summary: 'Baby and children''s products: clothing, car seats, strollers, feeding and nursery.'
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: bt
      path: Baby & Toddler
    - id: aa-1-25
      path: Apparel & Accessories > Clothing > Baby & Children's Clothing
    - id: aa-8-11
      path: Apparel & Accessories > Shoes > Baby & Children's Shoes
hidden_spec:
  - product_type
  - brand
  - product_name
  - age
  - size
  - size_system
  - measurements
  - weight_limit
  - compatibility
  - material
  - safety_standard
  - care
  - budget
  - quantity
  - gift
  - delivery_by
intents:
  replenish:
    - id: baby-kids.replenish.1
      text: My son outgrew his {product_name}. Same one in the next size up, {size}.
      slots: [product_name, size]
    - id: baby-kids.replenish.2
      text: Please reorder {quantity} packs of the {brand} {product_type} we use.
      slots: [quantity, brand, product_type]
  specify:
    - id: baby-kids.specify.1
      text: I need a {product_type} for a child aged {age} weighing {weight_limit}, meeting {safety_standard}, under {budget}.
      slots: [product_type, age, weight_limit, safety_standard, budget]
    - id: baby-kids.specify.2
      text: Looking for {material} {product_type} in size {size} ({size_system}), {care}.
      slots: [material, product_type, size, size_system, care]
  compare:
    - id: baby-kids.compare.1
      text: 'Compare your {product_type}s: which one works with {compatibility}, and which is lighter?'
      slots: [product_type, compatibility]
    - id: baby-kids.compare.2
      text: Which {product_type} will last longest for a child who is {measurements}?
      slots: [product_type, measurements]
  discover:
    - id: baby-kids.discover.1
      text: We have a baby due soon. What do we need first, under {budget}?
      slots: [budget]
    - id: baby-kids.discover.2
      text: I'm looking for a useful gift for a child aged {age}.
      slots: [age]
  express:
    - id: baby-kids.express.1
      text: Send a {product_type} in size {size} by {delivery_by}; pick a soft one.
      slots: [product_type, size, delivery_by]
    - id: baby-kids.express.2
      text: Just get me the {product_type} that fits {compatibility}, under {budget}.
      slots: [product_type, compatibility, budget]
hypotheses:
  - id: baby-kids.age-weight-height-ranges
    statement: Age, weight and height ranges are structured for car seats, carriers and clothing.
    why: Children's products are sized by weight and height more than by age, and a car seat outside its range is unsafe.
    where: [get_product.attributes, get_product.options, get_product.metafields]
    judge_decision: judge.age_suitability_correct
    evidence_grade: hypothesis
  - id: baby-kids.safety-standards
    statement: Safety standards and certifications (FMVSS 213, ECE R129, ASTM) are stated.
    why: Car seats and cots must meet the standard of the shopper's market, which only text can confirm.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.safety_claim_supported
    evidence_grade: hypothesis
  - id: baby-kids.kids-size-chart
    statement: Size charts give the height and age for each size as text.
    why: Children's sizes vary by brand, and parents shop by height.
    where: [get_product.description, get_product.metafields, policies]
    details: [size_chart]
    judge_decision: judge.size_matches_spec
    evidence_grade: hypothesis
  - id: baby-kids.materials-and-free-from
    statement: Materials and free-from claims (organic cotton, BPA-free) are text.
    why: Parents filter on these, and only stated claims can be trusted.
    where: [get_product.attributes, get_product.description]
    details: [material]
    judge_decision: judge.material_matches_spec
    evidence_grade: hypothesis
  - id: baby-kids.system-compatibility
    statement: Compatibility between systems is listed (which car seats fit which stroller, and the adapters needed).
    why: Travel systems are sold in parts that only work with the right adapters.
    where: [get_product.description, get_product.attributes, get_product.metafields]
    details: [compatibility]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: baby-kids.care
    statement: Care instructions are text.
    why: Children's things are washed constantly, so washability matters.
    where: [get_product.description]
    details: [care]
    judge_decision: judge.care_matches_spec
    evidence_grade: hypothesis
  - id: baby-kids.hygiene-returns
    statement: Returns for opened and hygiene items are answerable through the policy tool.
    why: Bottles, teethers and bedding are often non-returnable once opened.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
