# Category 9 of the store queue: Home decor / textiles.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Home decor / textiles
slug: home-decor-textiles
index: 9
summary: Home decor and textiles such as bedding, towels, rugs, curtains, cushions and decorative objects.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: hg-3
      path: Home & Garden > Decor
    - id: hg-15
      path: Home & Garden > Linens & Bedding
hidden_spec:
  - product_type
  - brand
  - product_name
  - dimensions
  - size
  - size_system
  - material
  - color
  - care
  - room
  - quantity
  - budget
  - delivery_by
  - returnable
intents:
  replenish:
    - id: home-decor-textiles.replenish.1
      text: I'd like two more of the {product_name} in {color} to match the ones I have.
      slots: [product_name, color]
    - id: home-decor-textiles.replenish.2
      text: 'Same {product_type} as before in {size}, please: {quantity} sets.'
      slots: [product_type, size, quantity]
  specify:
    - id: home-decor-textiles.specify.1
      text: I need {material} {product_type} for a {size} ({size_system}) bed in {color}, {care}, under {budget}.
      slots: [material, product_type, size, size_system, color, care, budget]
    - id: home-decor-textiles.specify.2
      text: Looking for a {product_type} of {dimensions} for my {room}, delivered by {delivery_by}.
      slots: [product_type, dimensions, room, delivery_by]
  compare:
    - id: home-decor-textiles.compare.1
      text: 'Compare your {material} {product_type}s under {budget}: which is softer, and which washes better?'
      slots: [material, product_type, budget]
    - id: home-decor-textiles.compare.2
      text: Which of your {product_type}s come in {dimensions}, and how do they differ?
      slots: [product_type, dimensions]
  discover:
    - id: home-decor-textiles.discover.1
      text: I'm redoing my {room} in {color}. What would you suggest under {budget}?
      slots: [room, color, budget]
    - id: home-decor-textiles.discover.2
      text: I'm looking for something cosy for my {room}; I like {material}.
      slots: [room, material]
  express:
    - id: home-decor-textiles.express.1
      text: Just send me a {color} {product_type} in {size}, under {budget}, that I can return.
      slots: [color, product_type, size, budget]
    - id: home-decor-textiles.express.2
      text: Need a {product_type} for my {room} by {delivery_by}. Pick a good one.
      slots: [product_type, room, delivery_by]
hypotheses:
  - id: home-decor-textiles.dimensions-and-bed-sizes
    statement: Dimensions are text, and bed sizes name their system with measurements (a US queen and a UK king differ).
    why: Bed size names mean different things in different markets, and without measurements the agent can buy bedding
      that does not fit.
    where: [get_product.options, get_product.attributes, get_product.description]
    details: [dimensions]
    judge_decision: judge.size_matches_spec
    evidence_grade: hypothesis
  - id: home-decor-textiles.fibre-composition
    statement: Fibre composition and construction (100% linen, 400 thread count, towel weight in gsm) are text.
    why: Material is the main quality signal in textiles, and photos cannot show it.
    where: [get_product.attributes, get_product.description]
    details: [material]
    judge_decision: judge.material_matches_spec
    evidence_grade: hypothesis
  - id: home-decor-textiles.care-instructions
    statement: Care instructions are text (machine washable, tumble dry low, dry clean only).
    why: Washability is a common hard requirement for bedding and cushions.
    where: [get_product.description, get_product.metafields]
    details: [care]
    judge_decision: judge.care_matches_spec
    evidence_grade: hypothesis
  - id: home-decor-textiles.colour-plain-names
    statement: Colours are variant options with plain names and a note on finish (matte, sheen).
    why: Decor is bought to match, and a marketing colour name gives a text agent nothing to match.
    where: [get_product.options]
    judge_decision: judge.color_matches_spec
    evidence_grade: hypothesis
  - id: home-decor-textiles.set-contents
    statement: What a set contains is listed, with the size of each piece (a duvet cover and two pillowcases).
    why: Set means different things across stores, and a shopper who needs four pillowcases needs the count.
    where: [get_product.description, get_product.attributes]
    judge_decision: judge.contents_match_spec
    evidence_grade: hypothesis
  - id: home-decor-textiles.made-to-order-lead-times
    statement: Made-to-order and custom sizes state their lead time before checkout.
    why: Custom curtains and rugs can take weeks, which breaks a delivery date the shopper gave.
    where: [get_product.description, policies]
    judge_decision: judge.delivery_by_respected
    evidence_grade: hypothesis
  - id: home-decor-textiles.returns-large-items
    statement: Returns for opened textiles and large items such as rugs are answerable through the policy tool.
    why: Large returns can be costly, and shoppers ask before buying.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
