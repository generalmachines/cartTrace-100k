# Category 12 of the store queue: Garden / outdoor home.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Garden / outdoor home
slug: garden-outdoor-home
index: 12
summary: 'Garden and outdoor living: grills, outdoor furniture, garden tools, plants and seeds.'
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: hg-12
      path: Home & Garden > Lawn & Garden
    - id: fr-15
      path: Furniture > Outdoor Furniture
    - id: hg-17
      path: Home & Garden > Plants
hidden_spec:
  - product_type
  - brand
  - product_name
  - dimensions
  - material
  - fuel
  - compatibility
  - plant_zone
  - room
  - quantity
  - budget
  - delivery_by
  - assembly
  - warranty
intents:
  replenish:
    - id: garden-outdoor-home.replenish.1
      text: I need a new cover for my {product_name}, for the same model as before.
      slots: [product_name]
    - id: garden-outdoor-home.replenish.2
      text: Same {brand} {product_type} refills as last time, {quantity} please.
      slots: [brand, product_type, quantity]
  specify:
    - id: garden-outdoor-home.specify.1
      text: I need a {fuel} {product_type} that fits in {dimensions}, under {budget}.
      slots: [fuel, product_type, dimensions, budget]
    - id: garden-outdoor-home.specify.2
      text: Looking for {product_type} that will survive {plant_zone} winters, delivered by {delivery_by}.
      slots: [product_type, plant_zone, delivery_by]
    - id: garden-outdoor-home.specify.3
      text: I want a {material} {product_type} for my {room}, with {assembly}.
      slots: [material, product_type, room, assembly]
  compare:
    - id: garden-outdoor-home.compare.1
      text: 'Compare your {product_type}s under {budget}: which stands up better to the weather?'
      slots: [product_type, budget]
    - id: garden-outdoor-home.compare.2
      text: Should I get the {fuel} or the battery {product_type}? Which works with {compatibility}?
      slots: [fuel, product_type, compatibility]
  discover:
    - id: garden-outdoor-home.discover.1
      text: My {room} gets full sun and I want it to look nicer. What do you suggest under {budget}?
      slots: [room, budget]
    - id: garden-outdoor-home.discover.2
      text: I'm looking for a {product_type} for a small {room}. Any ideas?
      slots: [product_type, room]
  express:
    - id: garden-outdoor-home.express.1
      text: Just send me a {product_type} that works with {compatibility} by {delivery_by}.
      slots: [product_type, compatibility, delivery_by]
    - id: garden-outdoor-home.express.2
      text: Pick a {fuel} {product_type} under {budget} with a good warranty.
      slots: [fuel, product_type, budget]
hypotheses:
  - id: garden-outdoor-home.weather-resistance
    statement: 'Weather resistance is specific: materials, UV and rust treatment, whether the item can stay outside in
      winter, and whether a cover is included.'
    why: Outdoor claims are vague by default, and a shopper's climate turns them into hard requirements.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.spec_matches_spec
    evidence_grade: hypothesis
  - id: garden-outdoor-home.dimensions-and-assembly
    statement: Dimensions, weight and assembly needs are text.
    why: Balconies and patios are small, and assembly is often the deciding factor.
    where: [get_product.attributes, get_product.description]
    details: [dimensions, weight]
    judge_decision: judge.dimensions_within_spec
    evidence_grade: hypothesis
  - id: garden-outdoor-home.plant-needs-and-shipping
    statement: Plants state their hardiness zone, sun and water needs, and the regions they cannot ship to.
    why: Plant shipping rules by state or country cause failed orders, and hardiness decides whether the plant survives.
    where: [get_product.attributes, get_product.description, policies]
    judge_decision: judge.delivery_constraint_disclosed
    evidence_grade: hypothesis
  - id: garden-outdoor-home.fuel-and-battery-platform
    statement: Fuel type or battery platform (propane, natural gas, a 40V system) and what is included (battery, charger)
      are stated.
    why: Battery tools only work with their own platform, and grills only with the gas the shopper has.
    where: [get_product.attributes, get_product.options, get_product.description]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: garden-outdoor-home.seasonal-delivery
    statement: Seasonal availability and delivery windows are stated before checkout.
    why: Plants and seasonal goods ship in windows that can miss a shopper's date.
    where: [policies, get_product.description]
    judge_decision: judge.delivery_by_respected
    evidence_grade: hypothesis
  - id: garden-outdoor-home.warranty
    statement: Warranty terms are answerable through the policy tool.
    why: Outdoor equipment is bought on durability, so the warranty matters.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
