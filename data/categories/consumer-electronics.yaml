# Category 18 of the store queue: Consumer electronics.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Consumer electronics
slug: consumer-electronics
index: 18
summary: Audio, phones and accessories, cameras, smart home devices and televisions.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: el-2
      path: Electronics > Audio
    - id: el-4-8
      path: Electronics > Communications > Telephony
    - id: el-17
      path: Electronics > Video
    - id: co-2
      path: Cameras & Optics > Cameras
hidden_spec:
  - product_type
  - brand
  - product_name
  - compatibility
  - specs
  - power
  - condition
  - color
  - warranty
  - budget
  - quantity
  - delivery_by
  - returnable
intents:
  replenish:
    - id: consumer-electronics.replenish.1
      text: My {product_name} charger died. I need the same one again.
      slots: [product_name]
    - id: consumer-electronics.replenish.2
      text: Same {brand} {product_type} as before, {quantity} of them.
      slots: [brand, product_type, quantity]
  specify:
    - id: consumer-electronics.specify.1
      text: I need {product_type} that work with {compatibility}, with {specs}, under {budget}.
      slots: [product_type, compatibility, specs, budget]
    - id: consumer-electronics.specify.2
      text: Looking for a {condition} {product_type} in {color} with {power}, by {delivery_by}.
      slots: [condition, product_type, color, power, delivery_by]
  compare:
    - id: consumer-electronics.compare.1
      text: 'Compare your two best {product_type}s under {budget}: battery life and sound.'
      slots: [product_type, budget]
    - id: consumer-electronics.compare.2
      text: Is the {product_name} compatible with {compatibility}, and how does it compare with the cheaper model?
      slots: [product_name, compatibility]
  discover:
    - id: consumer-electronics.discover.1
      text: I want better sound in my living room for under {budget}. What do you suggest?
      slots: [budget]
    - id: consumer-electronics.discover.2
      text: I'm looking for a tech gift around {budget} for someone who has everything.
      slots: [budget]
  express:
    - id: consumer-electronics.express.1
      text: Just send me a {product_type} that works with {compatibility} by {delivery_by}.
      slots: [product_type, compatibility, delivery_by]
    - id: consumer-electronics.express.2
      text: Pick the best {product_type} with {specs} under {budget}.
      slots: [product_type, specs, budget]
hypotheses:
  - id: consumer-electronics.compatibility-lists
    statement: Compatibility is listed by model and standard (phone models, Bluetooth codecs, connectors, operating systems).
    why: Accessories are bought to fit a device, and a model list is the only reliable check.
    where: [get_product.attributes, get_product.description, get_product.metafields]
    details: [compatibility]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: consumer-electronics.key-specs
    statement: Key specs are attributes (battery life, resolution, refresh rate, noise cancelling).
    why: Electronics are compared on numbers, and numbers in marketing copy are easy to misread.
    where: [get_product.attributes, get_product.metafields]
    judge_decision: judge.spec_matches_spec
    evidence_grade: hypothesis
  - id: consumer-electronics.regional-variants
    statement: Regional variants state the plug type, voltage and network bands for the shopper's market.
    why: A phone without the right bands or a charger with the wrong plug is a wrong item that looks right.
    where: [get_product.options, get_product.attributes]
    judge_decision: judge.power_matches_market
    evidence_grade: hypothesis
  - id: consumer-electronics.in-the-box
    statement: What is in the box is listed (charger, cable, case).
    why: Many devices now ship without a charger, which shoppers ask about.
    where: [get_product.description, get_product.attributes]
    judge_decision: judge.contents_match_spec
    evidence_grade: hypothesis
  - id: consumer-electronics.condition-grades
    statement: Condition (new, refurbished, open box) and refurbished grades are explicit for each variant.
    why: Refurbished and new units can share a listing, and the grade decides the price.
    where: [get_product.options, get_product.attributes]
    judge_decision: judge.condition_matches_spec
    evidence_grade: hypothesis
  - id: consumer-electronics.stock-per-variant
    statement: Stock is reported per storage size and colour.
    why: Popular configurations sell out first, and carts with an unavailable variant fail.
    where: [get_product.options]
    judge_decision: judge.variant_available
    evidence_grade: hypothesis
  - id: consumer-electronics.warranty-and-returns
    statement: Warranty and returns, including restocking fees, are answerable through the policy tool.
    why: Electronics buyers check both before committing to an expensive item.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
