# Category 22 of the store queue: Arts / crafts / music.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Arts / crafts / music
slug: arts-crafts-music
index: 22
summary: Art and craft supplies, sewing and knitting, and musical instruments and accessories.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: ae-2-1
      path: Arts & Entertainment > Hobbies & Creative Arts > Arts & Crafts
    - id: ae-2-8
      path: Arts & Entertainment > Hobbies & Creative Arts > Musical Instruments
    - id: ae-2-7
      path: Arts & Entertainment > Hobbies & Creative Arts > Musical Instrument & Orchestra Accessories
hidden_spec:
  - product_type
  - brand
  - product_name
  - material
  - color
  - compatibility
  - skill_level
  - specs
  - pack_size
  - quantity
  - budget
  - delivery_by
intents:
  replenish:
    - id: arts-crafts-music.replenish.1
      text: I need {quantity} more of the {product_name} in {color}, from the same dye lot if possible.
      slots: [quantity, product_name, color]
    - id: arts-crafts-music.replenish.2
      text: Same {brand} {product_type} as last time, {pack_size}.
      slots: [brand, product_type, pack_size]
  specify:
    - id: arts-crafts-music.specify.1
      text: I need {material} {product_type} with {specs}, {pack_size}, under {budget}.
      slots: [material, product_type, specs, pack_size, budget]
    - id: arts-crafts-music.specify.2
      text: Looking for {product_type} that fit {compatibility}, delivered by {delivery_by}.
      slots: [product_type, compatibility, delivery_by]
  compare:
    - id: arts-crafts-music.compare.1
      text: Compare your {product_type}s for a {skill_level} player under {budget}.
      slots: [product_type, skill_level, budget]
    - id: arts-crafts-music.compare.2
      text: What's the difference between your {material} and synthetic {product_type}?
      slots: [material, product_type]
  discover:
    - id: arts-crafts-music.discover.1
      text: I want to take up a new craft as a {skill_level}. What would you suggest under {budget}?
      slots: [skill_level, budget]
    - id: arts-crafts-music.discover.2
      text: I'm looking for a gift for someone who paints, maybe something in {material}?
      slots: [material]
  express:
    - id: arts-crafts-music.express.1
      text: Just send me {product_type} that fit {compatibility} by {delivery_by}.
      slots: [product_type, compatibility, delivery_by]
    - id: arts-crafts-music.express.2
      text: Pick a {product_type} for a {skill_level} under {budget}.
      slots: [product_type, skill_level, budget]
hypotheses:
  - id: arts-crafts-music.material-specs
    statement: Material specs are attributes (paper weight in gsm, paint type and pigment, yarn weight and fibre).
    why: Makers buy to a spec, and a spec in an image or a vague name cannot be matched.
    where: [get_product.attributes, get_product.description]
    details: [material]
    judge_decision: judge.material_matches_spec
    evidence_grade: hypothesis
  - id: arts-crafts-music.instrument-variants
    statement: Instrument variants are explicit (left-handed, scale length, number of strings, sizes such as 3/4).
    why: A right-handed guitar for a left-handed player is a wrong item that looks right in the cart.
    where: [get_product.options, get_product.attributes]
    judge_decision: judge.variant_matches_spec
    evidence_grade: hypothesis
  - id: arts-crafts-music.skill-level
    statement: The intended skill level is stated.
    why: Beginner and professional supplies differ in price and in what they forgive.
    where: [get_product.attributes, get_product.description]
    judge_decision: judge.use_case_matches_spec
    evidence_grade: hypothesis
  - id: arts-crafts-music.consumable-compatibility
    statement: Strings, reeds, cartridges and refills list what they fit.
    why: Consumables are replenished to fit one instrument or tool.
    where: [get_product.attributes, get_product.description, get_product.metafields]
    details: [compatibility]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: arts-crafts-music.set-contents
    statement: Set contents and colour counts are listed.
    why: Sets with the same name include different pieces.
    where: [get_product.description, get_product.attributes]
    judge_decision: judge.contents_match_spec
    evidence_grade: hypothesis
  - id: arts-crafts-music.cut-to-order-returns
    statement: Returns for cut-to-order or opened supplies are answerable through the policy tool.
    why: Fabric cut to length and opened supplies are usually final sale.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
