# Category 11 of the store queue: Kitchen / dining.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Kitchen / dining
slug: kitchen-dining
index: 11
summary: Cookware, bakeware, small appliances, knives, tableware and drinkware.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: hg-11
      path: Home & Garden > Kitchen & Dining
hidden_spec:
  - product_type
  - brand
  - product_name
  - capacity
  - dimensions
  - material
  - compatibility
  - power
  - color
  - care
  - quantity
  - budget
  - delivery_by
  - warranty
intents:
  replenish:
    - id: kitchen-dining.replenish.1
      text: I need a replacement {product_name}; mine broke. Same {capacity} size.
      slots: [product_name, capacity]
    - id: kitchen-dining.replenish.2
      text: Can I get {quantity} more of the {product_type} in {color} to complete my set?
      slots: [quantity, product_type, color]
  specify:
    - id: kitchen-dining.specify.1
      text: I need a {capacity} {product_type} that works on {compatibility}, {care}, under {budget}.
      slots: [capacity, product_type, compatibility, care, budget]
    - id: kitchen-dining.specify.2
      text: Looking for a {material} {product_type} with {power}, delivered by {delivery_by}.
      slots: [material, product_type, power, delivery_by]
  compare:
    - id: kitchen-dining.compare.1
      text: 'Compare your non-stick {product_type}s under {budget}: what are the coatings, and which lasts longer?'
      slots: [product_type, budget]
    - id: kitchen-dining.compare.2
      text: Which {product_type} has the longer warranty and the bigger capacity?
      slots: [product_type]
  discover:
    - id: kitchen-dining.discover.1
      text: I'm setting up my first kitchen. What basics would you suggest under {budget}?
      slots: [budget]
    - id: kitchen-dining.discover.2
      text: I'm looking for a {product_type} for someone who cooks a lot. Any ideas?
      slots: [product_type]
  express:
    - id: kitchen-dining.express.1
      text: Send me a {capacity} {product_type} that works on {compatibility} by {delivery_by}.
      slots: [capacity, product_type, compatibility, delivery_by]
    - id: kitchen-dining.express.2
      text: Just pick a good {material} {product_type} under {budget}.
      slots: [material, product_type, budget]
hypotheses:
  - id: kitchen-dining.capacity-and-dimensions
    statement: Capacity (litres, quarts, cups) and dimensions (diameter, height) are attributes.
    why: Cookware and appliances are chosen by size, and a size in an image or a title is easy to misread.
    where: [get_product.attributes, get_product.options]
    details: [dimensions]
    judge_decision: judge.capacity_matches_spec
    evidence_grade: hypothesis
  - id: kitchen-dining.materials-and-coatings
    statement: Materials and coatings are specific (18/10 stainless steel, PTFE or ceramic coating, PFAS-free claims and
      what they cover).
    why: Coating questions are common, and vague claims cannot be checked by an agent.
    where: [get_product.attributes, get_product.description]
    details: [material]
    judge_decision: judge.material_matches_spec
    evidence_grade: hypothesis
  - id: kitchen-dining.hob-compatibility
    statement: Hob and oven compatibility (induction, gas, oven-safe temperature) is stated.
    why: Induction compatibility is a hard requirement that a photo cannot show.
    where: [get_product.attributes, get_product.description]
    details: [compatibility]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: kitchen-dining.care-and-dishwasher
    statement: Care (dishwasher-safe, hand wash only) is text.
    why: Dishwasher-safe is a frequent requirement for tableware and knives.
    where: [get_product.description, get_product.attributes]
    details: [care]
    judge_decision: judge.care_matches_spec
    evidence_grade: hypothesis
  - id: kitchen-dining.power-per-market
    statement: Appliances state their voltage and plug type for each market.
    why: A US appliance delivered to the UK is useless, and cross-border tasks test exactly this.
    where: [get_product.attributes, get_product.options, get_product.description]
    judge_decision: judge.power_matches_market
    evidence_grade: hypothesis
  - id: kitchen-dining.set-contents
    statement: 'Set contents are listed with sizes (an 8-piece set: 20 cm and 24 cm pans, and so on).'
    why: Piece counts include lids and utensils differently from store to store.
    where: [get_product.description, get_product.attributes]
    judge_decision: judge.contents_match_spec
    evidence_grade: hypothesis
  - id: kitchen-dining.warranty
    statement: Warranty length and coverage are stated on the product or answerable through the policy tool.
    why: Appliance and cookware buyers compare warranties before choosing.
    where: [policies, get_product.description]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
