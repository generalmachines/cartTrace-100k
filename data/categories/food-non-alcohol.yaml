# Category 13 of the store queue: Food / non-alcohol.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Food / non-alcohol
slug: food-non-alcohol
index: 13
summary: Food and non-alcoholic drinks such as coffee, tea, snacks, chocolate and pantry goods. Alcohol and tobacco are
  out of scope.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: fb-2
      path: Food, Beverages & Tobacco > Food Items
    - id: fb-1-3
      path: Food, Beverages & Tobacco > Beverages > Coffee
    - id: fb-1-14
      path: Food, Beverages & Tobacco > Beverages > Tea & Infusions
hidden_spec:
  - product_type
  - brand
  - product_name
  - flavor
  - dietary
  - allergens
  - ingredients
  - pack_size
  - quantity
  - subscription
  - budget
  - delivery_by
  - gift
intents:
  replenish:
    - id: food-non-alcohol.replenish.1
      text: Please reorder my {product_name}, the {pack_size} bag, {quantity} of them.
      slots: [product_name, pack_size, quantity]
    - id: food-non-alcohol.replenish.2
      text: I'd like my usual {brand} {product_type} on a repeat delivery.
      slots: [brand, product_type]
  specify:
    - id: food-non-alcohol.specify.1
      text: I need a {dietary} {product_type} with no {allergens}, {pack_size}, under {budget}.
      slots: [dietary, product_type, allergens, pack_size, budget]
    - id: food-non-alcohol.specify.2
      text: Looking for a {flavor} {product_type} made with {ingredients}, delivered by {delivery_by}.
      slots: [flavor, product_type, ingredients, delivery_by]
  compare:
    - id: food-non-alcohol.compare.1
      text: 'Compare your {product_type}s: which is better value per kilo, and which is {dietary}?'
      slots: [product_type, dietary]
    - id: food-non-alcohol.compare.2
      text: What's the difference between your {flavor} options for {product_type}?
      slots: [flavor, product_type]
  discover:
    - id: food-non-alcohol.discover.1
      text: I want to try something new for breakfast that is {dietary}. Ideas under {budget}?
      slots: [dietary, budget]
    - id: food-non-alcohol.discover.2
      text: I'm looking for a food gift for a host who likes {flavor} things.
      slots: [flavor]
  express:
    - id: food-non-alcohol.express.1
      text: Send me {quantity} packs of a {dietary} {product_type} by {delivery_by}; whatever is fresh.
      slots: [quantity, dietary, product_type, delivery_by]
    - id: food-non-alcohol.express.2
      text: Just pick a {product_type} without {allergens}, under {budget}.
      slots: [product_type, allergens, budget]
hypotheses:
  - id: food-non-alcohol.allergen-statements
    statement: Ingredients and allergen statements (contains, may contain) are text for each product.
    why: Allergen safety is the hardest food constraint, and a photo of the back of the pack is invisible to a text agent.
    where: [get_product.description, get_product.metafields, get_product.attributes]
    details: [allergens, ingredients]
    judge_decision: judge.allergen_avoided
    evidence_grade: hypothesis
  - id: food-non-alcohol.dietary-certifications
    statement: Dietary claims and certifications (vegan, gluten-free, kosher, halal, organic) are attributes.
    why: Dietary rules are hard filters, and certifications only help when they are stated plainly.
    where: [get_product.attributes, get_product.metafields]
    judge_decision: judge.dietary_matches_spec
    evidence_grade: hypothesis
  - id: food-non-alcohol.nutrition-facts
    statement: Nutrition facts per serving are text.
    why: Shoppers ask about sugar, protein or caffeine, and a nutrition panel image cannot be read.
    where: [get_product.description, get_product.metafields]
    judge_decision: judge.nutrition_question_answered
    evidence_grade: hypothesis
  - id: food-non-alcohol.pack-size-and-unit-price
    statement: Pack size, count and weight are attributes per variant, so a unit price can be computed.
    why: Food is compared on price per kilo or per cup, which needs structured pack sizes.
    where: [get_product.options, get_product.attributes]
    details: [pack_size]
    judge_decision: judge.pack_size_matches_spec
    evidence_grade: hypothesis
  - id: food-non-alcohol.shelf-life-and-shipping
    statement: Shelf life, storage and perishable shipping limits (heat, distance) are stated before checkout.
    why: Perishable goods can be refused or spoil in transit, which looks like an agent failure.
    where: [get_product.description, policies]
    judge_decision: judge.delivery_constraint_disclosed
    evidence_grade: hypothesis
  - id: food-non-alcohol.subscription-plans
    statement: Repeat delivery is a selling plan with its interval, discount, and how to skip or cancel.
    why: Coffee and tea are replenished on a schedule, and the agent needs the plan to set it up.
    where: [get_product.options, policies]
    judge_decision: judge.subscription_handled
    evidence_grade: hypothesis
  - id: food-non-alcohol.flavour-variants
    statement: Flavours and grinds (whole bean, espresso grind) are variant options with plain names.
    why: Grind and flavour mistakes are common returns, and variants hidden in titles invite them.
    where: [get_product.options]
    judge_decision: judge.variant_matches_spec
    evidence_grade: hypothesis
