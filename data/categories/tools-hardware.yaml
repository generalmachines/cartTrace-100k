# Category 21 of the store queue: Tools / hardware.
#
# Hypotheses are claims to test with paired runs (the same store, task and day, with the detail visible
# and hidden), not findings. Keep evidence_grade at hypothesis until those runs exist. Schema and rules:
# carttrace.stores.categories; field names: _fields.yaml.
schema: mc.category.v1
name: Tools / hardware
slug: tools-hardware
index: 21
summary: Power tools, hand tools, hardware and DIY supplies.
shopify_taxonomy:
  version: 2026-08
  approximate: true
  note: Best-effort parent categories in Shopify's Standard Product Taxonomy (release 2026-08, github.com/Shopify/product-taxonomy).
    The paths exist in that release; mapping this queue category onto them is our judgement, not an official mapping.
  paths:
    - id: ha-15
      path: Hardware > Tools
    - id: ha-14
      path: Hardware > Tool Accessories
    - id: ha-6
      path: Hardware > Hardware Accessories
hidden_spec:
  - product_type
  - brand
  - product_name
  - compatibility
  - specs
  - power
  - pack_size
  - quantity
  - condition
  - budget
  - delivery_by
  - warranty
intents:
  replenish:
    - id: tools-hardware.replenish.1
      text: 'I need more {product_name}: {quantity} boxes of {pack_size}.'
      slots: [product_name, quantity, pack_size]
    - id: tools-hardware.replenish.2
      text: Same {brand} {product_type} as before; mine broke.
      slots: [brand, product_type]
  specify:
    - id: tools-hardware.specify.1
      text: I need a {product_type} for the {compatibility} battery system, tool only, under {budget}.
      slots: [product_type, compatibility, budget]
    - id: tools-hardware.specify.2
      text: Looking for {product_type} with {specs}, {pack_size}, delivered by {delivery_by}.
      slots: [product_type, specs, pack_size, delivery_by]
  compare:
    - id: tools-hardware.compare.1
      text: 'Compare your {product_type}s under {budget}: torque, weight and warranty.'
      slots: [product_type, budget]
    - id: tools-hardware.compare.2
      text: Should I buy the kit or the bare {product_type} if I already have {compatibility} batteries?
      slots: [product_type, compatibility]
  discover:
    - id: tools-hardware.discover.1
      text: I'm starting DIY at home. Which tools do I need first, under {budget}?
      slots: [budget]
    - id: tools-hardware.discover.2
      text: I'm looking for a {product_type} for occasional use. What do you recommend?
      slots: [product_type]
  express:
    - id: tools-hardware.express.1
      text: Just send me a {product_type} that takes {compatibility} batteries by {delivery_by}.
      slots: [product_type, compatibility, delivery_by]
    - id: tools-hardware.express.2
      text: Pick a {power} {product_type} under {budget}.
      slots: [power, product_type, budget]
hypotheses:
  - id: tools-hardware.battery-platform
    statement: The battery platform, and whether the item is tool-only or a kit, are attributes.
    why: Tool-only listings at kit-like prices are a common trap, and the platform decides compatibility.
    where: [get_product.attributes, get_product.options]
    details: [compatibility]
    judge_decision: judge.compatibility_matches_spec
    evidence_grade: hypothesis
  - id: tools-hardware.kit-contents
    statement: Kit contents are listed (batteries with their capacity, charger, case, bits).
    why: Kits with the same name differ in battery size and accessories.
    where: [get_product.description, get_product.attributes]
    judge_decision: judge.contents_match_spec
    evidence_grade: hypothesis
  - id: tools-hardware.performance-specs
    statement: Performance specs are numbers (torque, voltage, speed, chuck size).
    why: Tools are compared on these numbers, which marketing copy often omits.
    where: [get_product.attributes, get_product.metafields]
    judge_decision: judge.spec_matches_spec
    evidence_grade: hypothesis
  - id: tools-hardware.hardware-standards
    statement: Hardware states its standard and size (M6, 1/4-20, length, material, finish).
    why: Fasteners and fittings only work at the exact size and thread.
    where: [get_product.attributes, get_product.options]
    judge_decision: judge.spec_matches_spec
    evidence_grade: hypothesis
  - id: tools-hardware.pack-quantity
    statement: Pack quantity is an attribute (a box of 100).
    why: Hardware is priced per pack, and a count in the title is easy to misread.
    where: [get_product.options, get_product.attributes]
    details: [pack_size]
    judge_decision: judge.pack_size_matches_spec
    evidence_grade: hypothesis
  - id: tools-hardware.warranty
    statement: Warranty terms, including the battery warranty, are answerable through the policy tool.
    why: Tool brands compete on warranty, and buyers ask about it.
    where: [policies]
    judge_decision: judge.policy_question_answered
    evidence_grade: hypothesis
